[agent]
  interval = "10s"
  flush_interval = "10s"
  ## In-memory buffer holds points when InfluxDB is unreachable.
  ## At ~6 readings/min, 100k points ≈ 11 days of buffer.
  metric_buffer_limit = 100000
  flush_jitter = "5s"

# Subscribe to rtl_433 MQTT messages
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["rtl_433/+/events"]
  data_format = "json"
  topic_tag = "topic"

  ## QoS 1 = at-least-once delivery. Combined with persistent_session,
  ## Mosquitto queues messages when Telegraf is disconnected.
  qos = 1
  client_id = "telegraf-pool"
  persistent_session = true

  ## Credentials — empty strings = anonymous (standalone default).
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"

  # Tag incoming data by sensor model and id for filtering in Grafana
  tag_keys = ["model", "id", "channel"]

  # Keep all numeric fields rtl_433 sends (temperature_C, humidity, battery_ok, etc.)
  json_string_fields = ["model"]

# Only keep data from our Inkbird sensor(s). INKBIRD_SENSOR_IDS is a
# comma-separated list (12345 or 12345,67890). The older quoted form
# (12345", "67890) still works: quotes and spaces are stripped. This is a
# script rather than processors.filter because Telegraf substitutes ${VAR}
# inside an already-parsed string, so a list can't be spliced into TOML.
# Readings whose id isn't listed are dropped, so a wrong ID means nothing gets
# recorded (./scripts/verify.sh warns when no recent data arrives). Empty = keep all.
[[processors.starlark]]
  namepass = ["mqtt_consumer"]
  source = '''
SENSOR_IDS = [s.strip().strip('"').strip() for s in r'${INKBIRD_SENSOR_IDS}'.split(",")]
SENSOR_IDS = [s for s in SENSOR_IDS if s]

def apply(metric):
    if SENSOR_IDS and metric.tags.get("id") not in SENSOR_IDS:
        return None
    return metric
'''

# Off-season: drop every sensor reading so nothing is written while the pool is
# closed. Telegraf keeps running and keeps its MQTT session, so the broker
# doesn't pile up queued messages that would all be written at once (stamped
# with the wrong time) when the season starts again. Telegraf fills in
# ${OFF_SEASON} before it parses the file, including inside this script.
[[processors.starlark]]
  namepass = ["mqtt_consumer"]
  source = '''
OFF_SEASON = "${OFF_SEASON:-false}".strip().lower() in ("true", "1", "yes", "on")

def apply(metric):
    if OFF_SEASON:
        return None
    return metric
'''

# Write to InfluxDB 2.x
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
