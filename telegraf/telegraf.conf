[agent]
  interval = "10s"
  flush_interval = "10s"

# Subscribe to rtl_433 MQTT messages
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["rtl_433/+/events"]
  data_format = "json"
  topic_tag = "topic"

  # Tag incoming data by sensor model and id for filtering in Grafana
  tag_keys = ["model", "id", "channel"]

  # Keep all numeric fields rtl_433 sends (temperature_C, humidity, battery_ok, etc.)
  json_string_fields = ["model"]

# Only keep data from our Inkbird sensor
[[processors.filter]]
  namepass = ["mqtt_consumer"]
  [processors.filter.tags]
    id = [${INKBIRD_SENSOR_IDS}]

# Write to InfluxDB 2.x
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
