services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    profiles: ["standalone", "edge"]
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_AUTH_PORT:-1884}:1884"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  rtl_433:
    image: hertzg/rtl_433:latest
    container_name: rtl_433
    restart: unless-stopped
    profiles: ["standalone", "edge"]
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    depends_on:
      - mosquitto
    command: >
      -f 433.92M
      -R 194
      -F mqtt://mosquitto:1883,retain=1

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    profiles: ["standalone", "server"]
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    profiles: ["standalone", "server"]
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INKBIRD_SENSOR_IDS: ${INKBIRD_SENSOR_IDS}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    profiles: ["standalone", "server"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: lax
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  dashboard:
    build:
      context: ./dashboard
      args:
        - VITE_APP_TITLE=${DASHBOARD_TITLE:-Pool Dashboard}
    container_name: pool-dashboard
    restart: unless-stopped
    profiles: ["standalone", "server"]
    ports:
      - "8080:8080"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TIMEZONE: ${TIMEZONE:-America/New_York}
      TZ: ${TIMEZONE:-America/New_York}
    depends_on:
      influxdb:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["standalone", "server"]
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dashboard

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  mosquitto-data:
  mosquitto-log:
