services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    restart: unless-stopped
    profiles: ["standalone", "edge"]
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  rtl_433:
    # hertzg/rtl_433 publishes only rolling master-* tags (no semver), so pin by
    # digest for reproducibility. Update the digest deliberately when upgrading.
    image: hertzg/rtl_433:master-alpine-3.23.4@sha256:a775b5b7b98aff241ba6f361d13a4265ed3fd3a59d12aacf00dcd5f4a2cacd29
    container_name: rtl_433
    # Pin the hostname so the default MQTT topic prefix (devices/states topics)
    # is stable across recreates. The events topic is pinned explicitly below.
    # Without this, the topic embeds the random container ID, and a recreate
    # leaves an orphaned topic whose retained message Telegraf keeps re-ingesting
    # as a phantom flat-value "sensor" (see docs/deployment.md troubleshooting).
    hostname: rtl_433
    restart: unless-stopped
    profiles: ["standalone", "edge"]
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    depends_on:
      - mosquitto
    # rtl_433 authenticates to the broker via the user=/pass= options in the -F
    # output URL below (${MQTT_USER}/${MQTT_PASSWORD} substituted from .env by
    # docker compose). rtl_433 also honors MQTT_USERNAME/MQTT_PASSWORD env vars,
    # but the explicit URL options are self-documenting and unambiguous.
    # The events topic is pinned to rtl_433/sensor/events (still matched by
    # Telegraf's rtl_433/+/events) so recreates never spawn new topics. retain is
    # intentionally OFF: the dashboard reads from InfluxDB, not MQTT, so a retained
    # last value adds no value and would be re-ingested on every Telegraf reconnect.
    # qos=1: publish at least-once so Mosquitto QUEUES messages for Telegraf's
    # persistent session while it is disconnected (e.g. during cross-host keepalive
    # flapping in split mode) and delivers them on reconnect. With the rtl_433
    # default qos=0, Mosquitto drops messages for an offline subscriber → data loss.
    # NOTE: after changing credentials, recreate the container (docker compose
    # up -d --force-recreate rtl_433) — `restart` keeps the old definition.
    command: >
      -f 433.92M
      -R 194
      -F mqtt://mosquitto:1883,user=${MQTT_USER},pass=${MQTT_PASSWORD},events=rtl_433/sensor/events,qos=1

  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped
    profiles: ["standalone", "server"]
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  telegraf:
    image: telegraf:1.38.4
    container_name: telegraf
    restart: unless-stopped
    profiles: ["standalone", "server"]
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INKBIRD_SENSOR_IDS: ${INKBIRD_SENSOR_IDS}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    profiles: ["standalone", "server"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: lax
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  dashboard:
    build:
      context: ./dashboard
      args:
        - VITE_APP_TITLE=${DASHBOARD_TITLE:-Pool Dashboard}
    container_name: pool-dashboard
    restart: unless-stopped
    profiles: ["standalone", "server"]
    # Defense-in-depth: drop privileges and make the root FS read-only. The app
    # only needs writable scratch for /tmp and the fontconfig cache (OG image).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/fontconfig
    ports:
      - "8080:8080"
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TIMEZONE: ${TIMEZONE:-America/New_York}
      TZ: ${TIMEZONE:-America/New_York}
      CHEM_AUTH_USER: ${CHEM_AUTH_USER:-}
      CHEM_AUTH_PASSWORD: ${CHEM_AUTH_PASSWORD:-}
    depends_on:
      influxdb:
        condition: service_healthy

  weather:
    build:
      context: ./weather
    container_name: weather
    restart: unless-stopped
    profiles: ["standalone", "server"]
    # Defense-in-depth: drop privileges and make the root FS read-only. The
    # poller only needs writable scratch for /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-19012}
      WEATHER_INTERVAL_MINUTES: ${WEATHER_INTERVAL_MINUTES:-30}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    depends_on:
      influxdb:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["standalone", "server"]
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dashboard

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  mosquitto-data:
  mosquitto-log:
