# MQTT Broker — distributed / edge mode
# Bind to all interfaces so the remote server's Telegraf can connect.
listener 1883 0.0.0.0

# Authentication required when broker is network-exposed.
allow_anonymous false
password_file /mosquitto/config/password_file

# Persistence — buffers messages for disconnected persistent-session
# subscribers (Telegraf with QoS 1) across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Buffer up to 10k messages per offline subscriber.
# At ~6 messages/min from the Inkbird, this is ~27 hours of buffering.
max_queued_messages 10000
max_queued_bytes 0
max_inflight_messages 40

# Logging
log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true
