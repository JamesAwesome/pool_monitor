# MQTT Broker — distributed / edge mode
# Two listeners: one for local Docker containers (anonymous), one for
# remote connections (authenticated).

# Per-listener security settings
per_listener_settings true

# Local listener — for rtl_433 on the same Docker network.
# Bound to 0.0.0.0 on an internal port, but only Docker containers
# on the same compose network will reach it.
listener 1883
allow_anonymous true

# External listener — for Telegraf on the remote server.
# Requires password authentication.
listener 1884
allow_anonymous false
password_file /mosquitto/config/password_file

# Persistence — buffers messages for disconnected persistent-session
# subscribers (Telegraf with QoS 1) across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Buffer up to 10k messages per offline subscriber.
# At ~6 messages/min from the Inkbird, this is ~27 hours of buffering.
max_queued_messages 10000
max_queued_bytes 0
max_inflight_messages 40

# Logging
log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages true
